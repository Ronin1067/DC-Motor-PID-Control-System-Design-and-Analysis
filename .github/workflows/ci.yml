name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall implementations/ benchmarks/

      - name: Run Tier 3 Neural-Adaptive STA Benchmark
        run: |
          python implementations/v3_neural_adaptive_cbf_sta/neural_adaptive_super_twisting.py

      - name: Run Tier 3 CBF-QP Safety Filter Benchmark
        run: |
          python implementations/v3_neural_adaptive_cbf_sta/cbf_qp_safety_filter.py
